<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family:monospace
        }
        h3,p{margin:0;}
        nav {
            background-color: #37495eff;
            padding:20px;
        }
         .item{
            background-color: blue;
            padding:10px;
            color: white; 
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 5px;
        }
        .item:hover {
            background-color: #e84d3dff;   
        }

        .User-profile-card {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            margin-top: 20px;
            text-align: center;
        }
        .user-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: auto;
            background-color: red;
            background-image: url('https://static.wikia.nocookie.net/roblox/images/2/28/John_Doe_and_Jane_Doe_%28Late_2016%29.png/revision/latest/scale-to-width/360?cb=20250914162541');
            background-size: cover;
            background-position: center;
        }
        .user-button:hover {
            background-color: #e84d3dff;
        }
        .House-Card {
            border-radius: 10px;
            position: relative;
            width: 250px;
            margin-top: 20px;
            overflow: hidden;
            border: solid 1px black;
        }
            .House-ForSale {
                background-color: #e97132ff;
                color: white;
                padding: 5px;
                position: absolute;
                top: 10px;
                left: 10px;
                text-transform: uppercase;
                font-size: 12px;
                border-radius: 5px;
            }
        .House-details {
            padding: 10px;

        }
        .House-image {
            height: 150px;
            background-image: url('./imagensaula3/apartment.jpeg');
            background-size: cover;
            background-position: center;
        }
            .Location {
                display: flex;
                align-items: center;
                gap: 5px;
                margin-top: 3px;
                margin-bottom: 5px;
            }
            .Location img {
                width: 20px;
                height: 20px;
            }
                .House-icons {
                    display: flex;
                    justify-content: space-around;
                    gap: 10px;
                    padding: 10px;
                    border-bottom: solid 2px gray;
                }
                .House-icons img {
                    width: 30px;
                    height: 30px;
                }
                .more-details {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 10px;
                } 
                    .House-price {
                        font-size: 14px;
                        font-weight: bold;
                    }
                    .button2 {
                        background-color: #757575;
                        color: white;
                        padding: 10px 15px;
                        border: none;
                        border-radius: 5px;
                        cursor: pointer;
                    }
                    .button2:hover {
                        background-color: #e84d3dff;
                    }
    </style>
</head>

<body>
    <h1>Página de Fotografias</h1>
    <nav>
    <a class="item" href="fotografias.html">Fotografias</a>
    <a class="item" href="index1.html">Página Inicial</a>
    </nav>

    <div class="User-Profile-Card">
        <div class ="user-image"></div>
        <h2>Iason Fitros</h2>
        <p>Artificial Intelligence </p>
        <a class ="user-button" href="#">Contact</a>
        <a class ="user-button" href="#">Follow</a>
    </div>
    <div class="House-Card">
        <div class ="House-image"></div>
        <div class="House-ForSale">
            <p>For Sale</p>
        </div>
        <div class="House-details">
            <h3>Vila in Sesimbra</h3>
            <div class="Location">
                <img src="./imagensaula3/icons8-location-100.png">
                <p>Sesimbra, Portugal</p>
            </div>
            <p> Lorem ipsum dolor, sit amet consectetur adipisicing elit.</p>
        </div>
            <div class="House-icons">
                <img src="./imagensaula3/icons8-bathroom-100.png">
                <img src="./imagensaula3/icons8-dining-room-100.png">
                <img src="./imagensaula3/icons8-fridge-100.png">
                <img src="./imagensaula3/icons8-surface-100.png">
            </div>
            <div class="more-details">
                <div class="House-price">
                    <p>Price</p> 
                    <p>€ 350.000</p>
                </div>
                <button class="button2">Consultar</button>
            </div>
    </div>
</html>
